[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bharatopt"
version = "0.1.0"
description = "BharatOpt CLI and pipeline utilities."
authors = [{name = "Your Name"}]
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
keywords = ["cli", "typer", "rich", "pipeline"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "fastapi>=0.118.0",
    "typer>=0.12.0",
    "uvicorn>=0.37.0",
    "rich>=13.7.0",
]

[project.scripts]
# Console script entry point
bharatopt = "bharatopt.cli:app"

[tool.setuptools.package-data]
"bharatopt.web" = ["static/*"]
